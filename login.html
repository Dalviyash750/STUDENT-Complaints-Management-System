```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | SCMS</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">SCMS</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="complaint.html">Submit Complaint</a>
        </nav>

        <a href="index.html" class="login-btn">Home</a>
    </header>

    <main class="login-page">

        <section class="login-card">

            <div class="login-icon">SC</div>

            <span class="section-label">STUDENT PORTAL</span>

            <h1>Welcome Back</h1>

            <p class="login-description">
                Login to access your student complaint portal.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email Address *</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password *</label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                        minlength="6"
                    >
                </div>

                <div id="loginMessage" class="form-message" role="status"></div>

                <button type="submit" class="primary-btn login-submit">
                    Login to Account →
                </button>

            </form>

            <p class="login-note">
                New to SCMS? You can register here when registration is available.
            </p>

        </section>

    </main>

    <footer class="complaint-footer">
        © 2026 Student Complaint Management System
    </footer>

    <script src="script.js"></script>

</body>
</html>
```
